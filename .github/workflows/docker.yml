name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test (${{ matrix.tag }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: bullseye/Dockerfile
            tag: latest
          - dockerfile: bookworm/Dockerfile
            tag: bookworm
          - dockerfile: bookworm/Dockerfile.slim
            tag: bookworm-slim
          - dockerfile: bullseye/Dockerfile
            tag: bullseye
          - dockerfile: bullseye/Dockerfile.slim
            tag: bullseye-slim

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build image"
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: "${{ matrix.dockerfile }}"
          load: true
          tags: "dockette/debian:${{ matrix.tag }}"

      - name: "Test image"
        run: "make test TAG=${{ matrix.tag }}"

  build:
    name: "Build"
    needs: ["test"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/debian"
      tag: "${{ matrix.tag }}"
      dockerfile: "${{ matrix.dockerfile }}"
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          # latest
          - dockerfile: bullseye/Dockerfile
            tag: latest
          # 12
          - dockerfile: bookworm/Dockerfile
            tag: bookworm
          - dockerfile: bookworm/Dockerfile.slim
            tag: bookworm-slim
          # 11
          - dockerfile: bullseye/Dockerfile
            tag: bullseye
          - dockerfile: bullseye/Dockerfile.slim
            tag: bullseye-slim
          # 10
          - dockerfile: buster/Dockerfile
            tag: buster
          - dockerfile: buster/Dockerfile.slim
            tag: buster-slim
          # 9
          - dockerfile: stretch/Dockerfile
            tag: stretch
          - dockerfile: stretch/Dockerfile.slim
            tag: stretch-slim

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Update Docker Hub description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "dockette/debian"
